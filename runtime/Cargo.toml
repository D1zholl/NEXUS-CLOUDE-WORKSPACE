[package]
name = "nexus-ai-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "NEXUS AI Runtime — исходящий исполнитель задач на компьютере с PolyStrata"
license = "MIT"

[[bin]]
name = "nexus-ai-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures-util = "0.3"
hex = "0.4"
jsonschema = { version = "0.61", default-features = false }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target."cfg(windows)".dependencies]
windows-service = { version = "0.8.1", default-features = false }

[dev-dependencies]
tempfile = "3"
