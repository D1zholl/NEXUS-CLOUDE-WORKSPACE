[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-platform",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# Core primitives
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v3", "v4", "v5", "serde"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
crc32fast = "1.5"
hex = "0.4"
url = "2.5"
futures-util = "0.3"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "stream",
    "http2",
    "charset",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "process",
    "net",
] }
tokio-util = { version = "0.7", features = ["rt"] }

# Storage
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
    "derive",
] }

# Internal crates
nexus-core = { path = "crates/nexus-core" }
nexus-platform = { path = "crates/nexus-platform" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
